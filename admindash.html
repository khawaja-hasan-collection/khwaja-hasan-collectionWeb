<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khawaja Hasan Collection — Admin</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#172033;--muted:#697386;--border:#e1e5eb;--dark:#121212;--gold:#f3bd39;--danger:#c43d3d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--dark);color:#fff;padding:10px 5vw;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}.brandLogo{width:46px;height:46px;flex:none}.brandText{font-size:18px;font-weight:700}.brandText span{color:#f0bc35}.adminLabel{font-size:11px;color:#bbb;letter-spacing:.12em;margin-top:3px}
header b{font-size:18px}button,input,select{font:inherit}.logout{border:1px solid #fff;background:transparent;color:#fff;padding:9px 14px;border-radius:5px;cursor:pointer}
main{max-width:1100px;margin:35px auto;padding:0 20px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:20px}
h1,h2{margin-top:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form select{padding:12px;border:1px solid var(--border);border-radius:6px;background:#fff}.primary{grid-column:1/-1;padding:12px;border:0;border-radius:6px;background:var(--dark);color:#fff;font-weight:700;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-top:1px solid var(--border)}.row:first-child{border-top:0}.danger{border:0;background:var(--danger);color:#fff;padding:8px 12px;border-radius:5px;cursor:pointer}.muted{color:var(--muted);font-size:14px}
#login{max-width:420px;margin:12vh auto}.error{color:var(--danger);min-height:20px}.fileBox{display:flex;flex-direction:column;gap:8px}.fileBox input[type=file]{padding:10px;border:1px solid var(--border);border-radius:6px;background:#fff}.preview{display:none;width:100%;height:150px;object-fit:cover;border-radius:7px;border:1px solid var(--border);background:#f5f1e9}.thumb{width:62px;height:62px;object-fit:cover;border-radius:7px;border:1px solid var(--border);background:#f5f1e9}
@media(max-width:650px){.form{grid-template-columns:1fr}.primary{grid-column:auto}.row{align-items:flex-start;flex-direction:column}.brandText{font-size:15px}.brandLogo{width:40px;height:40px}}
</style>
</head>
<body>
<div id="login" class="card">
<div class="brand" style="margin-bottom:18px"><svg class="brandLogo" viewBox="0 0 220 220" aria-label="Khawaja Hasan Collection logo" role="img"><defs><linearGradient id="kgLogin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".45" stop-color="#d6a62b"/><stop offset="1" stop-color="#fff1a8"/></linearGradient></defs><g fill="none" stroke="url(#kgLogin)" stroke-width="6" stroke-linejoin="round"><path d="M55 62 Q42 48 54 31 Q68 16 82 35 Q94 14 110 35 Q126 14 139 34 Q157 48 143 63"/><path d="M48 68 Q110 35 172 68"/></g><text x="110" y="132" text-anchor="middle" fill="url(#kgLogin)" font-family="Georgia,serif" font-size="76" font-weight="700">KHC</text><path d="M42 142 Q110 92 178 142" fill="none" stroke="url(#kgLogin)" stroke-width="7"/><text x="110" y="171" text-anchor="middle" fill="url(#kgLogin)" font-family="Georgia,serif" font-size="18" font-weight="700" letter-spacing="2">KHAWAJA HASAN</text><path d="M34 190H77 M143 190H186" stroke="url(#kgLogin)" stroke-width="4"/><text x="110" y="198" text-anchor="middle" fill="url(#kgLogin)" font-family="Georgia,serif" font-size="11" letter-spacing="3">COLLECTION</text></svg><div class="brandText">KHAWAJA <span>HASAN</span><div class="adminLabel">ADMIN DASHBOARD</div></div></div>
<h1>Admin Login</h1>
<p class="muted">Khawaja Hasan Collection administration</p>
<div class="form">
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login</button>
</div>
<p id="loginMsg" class="error"></p>
</div>

<div id="app" hidden>
<header><div class="brand"><svg class="brandLogo" viewBox="0 0 220 220" aria-label="Khawaja Hasan Collection logo" role="img"><defs><linearGradient id="kgHeader" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".45" stop-color="#d6a62b"/><stop offset="1" stop-color="#fff1a8"/></linearGradient></defs><g fill="none" stroke="url(#kgHeader)" stroke-width="6" stroke-linejoin="round"><path d="M55 62 Q42 48 54 31 Q68 16 82 35 Q94 14 110 35 Q126 14 139 34 Q157 48 143 63"/><path d="M48 68 Q110 35 172 68"/></g><text x="110" y="132" text-anchor="middle" fill="url(#kgHeader)" font-family="Georgia,serif" font-size="76" font-weight="700">KHC</text><path d="M42 142 Q110 92 178 142" fill="none" stroke="url(#kgHeader)" stroke-width="7"/><text x="110" y="171" text-anchor="middle" fill="url(#kgHeader)" font-family="Georgia,serif" font-size="18" font-weight="700" letter-spacing="2">KHAWAJA HASAN</text><path d="M34 190H77 M143 190H186" stroke="url(#kgHeader)" stroke-width="4"/><text x="110" y="198" text-anchor="middle" fill="url(#kgHeader)" font-family="Georgia,serif" font-size="11" letter-spacing="3">COLLECTION</text></svg><div><b>KHAWAJA <span>HASAN</span></b><div class="adminLabel">ADMIN DASHBOARD</div></div></div><button class="logout" onclick="logout()">Logout</button></header>
<main>
<section class="card">
<h2>Add Product</h2>
<p class="muted">Products added here are stored in Supabase and can appear on the storefront.</p>
<div class="form">
<input id="name" placeholder="Product name">
<select id="category"><option>Men</option><option>Women</option><option>Ethnic</option><option>Accessories</option></select>
<input id="price" type="number" min="0" placeholder="Price">
<input id="oldPrice" type="number" min="0" placeholder="Old price">
<div class="fileBox"><input id="imageFile" type="file" accept="image/*" onchange="previewImage(event)"><input id="image" placeholder="Or paste image URL"><img id="imagePreview" class="preview" alt="Product image preview"></div>
<input id="tag" placeholder="Tag (New, Bestseller...)">
<button class="primary" onclick="addProduct()">Add Product</button>
</div>
<p id="msg" class="muted"></p>
</section>

<section class="card">
<h2>Products</h2>
<div id="products"><p class="muted">Loading...</p></div>
</section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient(
'https://esibgnwcgvdyttmpvcgn.supabase.co',
'sb_publishable_qQSSmPQQ9tPyx_4g8D1Guw_AmP4N41a'
);

async function checkAdmin(){
 const {data}=await supabaseClient.auth.getUser();
 if(data.user?.app_metadata?.role==='admin'){
   document.getElementById('login').hidden=true;
   document.getElementById('app').hidden=false;
   loadProducts();
 }else{
   await supabaseClient.auth.signOut();
 }
}
async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const msg=document.getElementById('loginMsg');
 msg.textContent='Checking account...';
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error||data.user?.app_metadata?.role!=='admin'){
   await supabaseClient.auth.signOut();
   msg.textContent='Incorrect admin email or password.';
   return;
 }
 checkAdmin();
}
async function logout(){
 await supabaseClient.auth.signOut();
 location.reload();
}
function previewImage(event){
 const file=event.target.files?.[0],img=document.getElementById('imagePreview');
 if(!file){img.style.display='none';img.removeAttribute('src');return}
 img.src=URL.createObjectURL(file);
 img.style.display='block';
}
async function addProduct(){
 const name=document.getElementById('name').value.trim();
 const category=document.getElementById('category').value;
 const price=Number(document.getElementById('price').value);
 const oldPrice=Number(document.getElementById('oldPrice').value)||price;
 let image=document.getElementById('image').value.trim();
 const file=document.getElementById('imageFile').files?.[0];
 const tag=document.getElementById('tag').value.trim()||'New';
 const msg=document.getElementById('msg');
 if(!name||!price){msg.textContent='Name and price are required.';return}
 msg.textContent='Adding product...';
 try{
   if(file){
     if(!file.type.startsWith('image/'))throw new Error('invalid_image');
     const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
     const path=crypto.randomUUID()+'.'+ext;
     const upload=await supabaseClient.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});
     if(upload.error)throw upload.error;
     image=supabaseClient.storage.from('product-images').getPublicUrl(path).data.publicUrl;
   }
   const {error}=await supabaseClient.from('products').insert({
     name,category,price,old_price:oldPrice,tag,image_url:image||null,active:true
   });
   if(error)throw error;
   msg.textContent='Product added successfully. The image is now live on the storefront.';
   ['name','price','oldPrice','image','tag'].forEach(id=>document.getElementById(id).value='');
   document.getElementById('imageFile').value='';
   document.getElementById('imagePreview').style.display='none';
   document.getElementById('imagePreview').removeAttribute('src');
   loadProducts();
 }catch(e){
   msg.textContent=e.message==='invalid_image'?'Please choose an image file.':'Product could not be added. Check your admin role and image upload settings.';
 }
}
async function loadProducts(){
 const box=document.getElementById('products');
 const {data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
 if(error){box.innerHTML='<p class="muted">Could not load products.</p>';return}
 box.innerHTML=data.length?data.map(p=>`<div class="row"><div style="display:flex;align-items:center;gap:12px">${p.image_url?`<img class="thumb" src="${p.image_url}" alt="${escapeHtml(p.name)}">`:'<div class="thumb"></div>'}<div><b>${escapeHtml(p.name)}</b><div class="muted">${escapeHtml(p.category)} · ₹${Number(p.price).toLocaleString('en-IN')}</div></div></div><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div>`).join(''):'<p class="muted">No products added yet.</p>';
}
async function deleteProduct(id){
 if(!confirm('Delete this product?'))return;
 const {error}=await supabaseClient.from('products').delete().eq('id',id);
 if(error){alert('Product could not be deleted.');return}
 loadProducts();
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
supabaseClient.auth.onAuthStateChange(()=>checkAdmin());
checkAdmin();
</script>
</body>
</html>
