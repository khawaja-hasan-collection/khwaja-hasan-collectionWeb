<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | Khawaja Hasan Collection</title>
<style>
:root{--ink:#172033;--muted:#697386;--line:#e1e5eb;--gold:#f3bd39}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}.top{background:#171717;color:#fff;padding:9px 5vw;text-align:center;font-size:12px;letter-spacing:.08em}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 5vw;background:#111;color:white}.brand{font:700 20px Georgia,serif}.nav a{color:white;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:32px 5vw 70px}.back{display:inline-block;color:var(--muted);text-decoration:none;margin-bottom:24px}.product{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:42px;align-items:start}.galleryMain{background:#f5f2ec;border-radius:8px;overflow:hidden;min-height:420px;display:grid;place-items:center}.galleryMain img{display:block;width:100%;max-height:680px;object-fit:contain}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.thumb{width:72px;height:80px;border:1px solid var(--line);border-radius:5px;overflow:hidden;padding:0;background:white;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:cover}.eyebrow{color:#9a6b10;text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:800}.title{font:700 clamp(30px,4vw,44px)/1.1 Georgia,serif;margin:10px 0 18px}.price{font-size:25px;font-weight:800}.old{color:#8a91a0;text-decoration:line-through;margin-left:10px}.tag{display:inline-block;margin:16px 0;padding:6px 10px;background:#f5f6f8;border-radius:4px;font-size:12px}.desc{line-height:1.8;color:#515b6d;white-space:pre-line;margin:14px 0 26px}.add{width:100%;border:0;background:var(--gold);color:#171717;padding:15px;border-radius:5px;font-weight:800;font-size:15px;cursor:pointer}.note{color:var(--muted);font-size:13px;line-height:1.6;margin-top:15px}.error{padding:50px 15px;text-align:center}.error h1{font-family:Georgia,serif}@media(max-width:760px){.product{grid-template-columns:1fr;gap:25px}.galleryMain{min-height:280px}.galleryMain img{max-height:500px}.wrap{padding-top:22px}}
</style></head><body><div class="top">FREE SHIPPING ON ORDERS ABOVE ₹1,999 &nbsp; • &nbsp; EASY 7-DAY RETURNS</div><nav class="nav"><div class="brand">Khawaja Hasan Collection</div><a href="./index.html">← Continue shopping</a></nav><main class="wrap"><a class="back" href="./index.html">← Back to collection</a><div id="content"><div class="error">Loading product details…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=window.supabase.createClient('https://esibgnwcgvdyttmpvcgn.supabase.co','sb_publishable_qQSSmPQQ9tPyx_4g8D1Guw_AmP4N41a');
const root=document.getElementById('content');const id=new URLSearchParams(location.search).get('id');
function text(tag,value,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=value||'';return el}
function showError(message){const box=document.createElement('div');box.className='error';box.append(text('h1','Product not found'));box.append(text('p',message));const a=text('a','Back to collection');a.href='./index.html';a.style.color='#172033';box.append(a);root.replaceChildren(box)}
async function load(){if(!id){showError('Please open a product from the collection page.');return}try{const {data,error}=await client.from('products').select('*').eq('id',id).eq('active',true).maybeSingle();if(error)throw error;if(!data){showError('This product may have been removed or is no longer available.');return}
const gallery=[];[data.image_url,...(Array.isArray(data.image_urls)?data.image_urls:[])].forEach(u=>{if(typeof u==='string'&&/^https?:\/\//i.test(u)&&!gallery.includes(u))gallery.push(u)});
const layout=document.createElement('section');layout.className='product';const left=document.createElement('div');const main=document.createElement('div');main.className='galleryMain';const mainImg=document.createElement('img');mainImg.alt=data.name||'Product';if(gallery[0])mainImg.src=gallery[0];else main.append(text('p','No product image available','note'));if(gallery[0])main.append(mainImg);left.append(main);
if(gallery.length>1){const thumbs=document.createElement('div');thumbs.className='thumbs';gallery.forEach((url,i)=>{const b=document.createElement('button');b.className='thumb';b.type='button';b.setAttribute('aria-label','View image '+(i+1));const im=document.createElement('img');im.src=url;im.alt=(data.name||'Product')+' view '+(i+1);b.append(im);b.addEventListener('click',()=>{mainImg.src=url});thumbs.append(b)});left.append(thumbs)}
const right=document.createElement('div');right.append(text('div','KHAWAJA HASAN COLLECTION','eyebrow'));right.append(text('h1',data.name||'Product','title'));const price=text('div','₹'+Number(data.price||0).toLocaleString('en-IN'),'price');if(data.old_price&&Number(data.old_price)>Number(data.price||0)){price.append(text('span','₹'+Number(data.old_price).toLocaleString('en-IN'),'old'))}right.append(price);if(data.tag)right.append(text('span',data.tag,'tag'));if(data.category)right.append(text('p','Category: '+data.category,'note'));right.append(text('p',data.description||'Discover this piece from Khawaja Hasan Collection.','desc'));const add=text('button','Add to Bag','add');add.type='button';add.addEventListener('click',()=>{let bag=[];try{bag=JSON.parse(localStorage.getItem('khc_bag')||'[]')}catch(e){}bag.push({id:data.id,name:data.name,price:data.price,image_url:data.image_url});try{localStorage.setItem('khc_bag',JSON.stringify(bag))}catch(e){}add.textContent='Added to Bag ✓';setTimeout(()=>add.textContent='Add to Bag',1800)});right.append(add);right.append(text('p','Product images and details are shown here. Return to the collection to explore more styles.','note'));layout.append(left,right);root.replaceChildren(layout);document.title=(data.name||'Product')+' | Khawaja Hasan Collection'
}catch(e){console.error(e);showError('We could not load this product right now. Please go back and try again.')}}
load();
</script></body></html>
